<!DOCTYPE html>
<html lang="{{ site.lang }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}{% if page_title %} - {{ page_title }}{% endif %}</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@{{ site.bootstrap_version }}/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/{{ site.fontawesome_version }}/css/all.min.css">
    <link rel="stylesheet" href="{{ asset_prefix }}css/main.css">
    <link rel="icon" href="{{ asset_prefix }}favicon.ico" type="image/x-icon">
</head>

<body>
    {% include "partials/navbar.html" %}

    {% block banner %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@{{ site.bootstrap_version }}/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
