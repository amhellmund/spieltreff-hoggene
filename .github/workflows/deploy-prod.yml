name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment configuration
        run: |
          missing=()
          [ -z "${{ vars.HOST }}" ] && missing+=("vars.HOST")
          [ -z "${{ vars.DEPLOY_DIR }}" ] && missing+=("vars.DEPLOY_DIR")
          [ -z "${{ secrets.USERNAME }}" ] && missing+=("secrets.USERNAME")
          [ -z "${{ secrets.PASSWORD }}" ] && missing+=("secrets.PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required config for the 'prod' environment: ${missing[*]}. Set these under Settings > Environments > prod."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Build site
        run: uv run build-page

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          uv run deploy-page \
            --host "${{ vars.HOST }}" \
            --username "${{ secrets.USERNAME }}" \
            --deploy-dir "${{ vars.DEPLOY_DIR }}"
