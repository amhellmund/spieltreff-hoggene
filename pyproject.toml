[project]
name = "spieltreff-hoggene"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "paramiko>=3.5.0",
    "scp>=0.15.0",
    "tqdm>=4.67.0",
]

[project.scripts]
build-page = "build:main"
deploy-page = "deploy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "build.py",
    "deploy.py",
    "generator/**",
]
